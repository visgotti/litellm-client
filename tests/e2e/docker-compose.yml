services:
  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    ports:
      - "14000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health/liveliness"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 30s
