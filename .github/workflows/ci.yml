name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────── lint + type-check ─────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  # ───────────────────── unit tests (matrix) ───────────────────
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run test:unit -- --coverage
      - name: Upload coverage artifact
        if: matrix.node-version == 24
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/
      - name: Upload coverage to Codecov
        if: matrix.node-version == 24
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

  # ───────────────────── build ──────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ───────────────────── e2e (per-provider matrix) ─────────────
  # Runs the full LiteLLM proxy round-trip against a single live provider per
  # matrix leg. All 5 legs run concurrently. Each leg fails hard if its own
  # *_API_KEY is missing — there's no silent skip.
  e2e:
    name: e2e (${{ matrix.provider }})
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 25
    environment: live

    strategy:
      fail-fast: false
      matrix:
        provider: [openai, anthropic, deepseek, gemini, alibaba]

    env:
      LITELLM_E2E_PROVIDER: ${{ matrix.provider }}
      OPENAI_API_KEY:    ${{ matrix.provider == 'openai'    && secrets.OPENAI_API_KEY    || '' }}
      ANTHROPIC_API_KEY: ${{ matrix.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
      DEEPSEEK_API_KEY:  ${{ matrix.provider == 'deepseek'  && secrets.DEEPSEEK_API_KEY  || '' }}
      GEMINI_API_KEY:    ${{ matrix.provider == 'gemini'    && secrets.GEMINI_API_KEY    || '' }}
      ALIBABA_API_KEY:   ${{ matrix.provider == 'alibaba'   && secrets.ALIBABA_API_KEY   || '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Pre-pull container images
        run: |
          docker pull postgres:16-alpine
          docker pull ghcr.io/berriai/litellm:main-stable

      - name: Run e2e suite (${{ matrix.provider }})
        run: npm run test:e2e

      - name: Dump LiteLLM proxy logs on failure
        if: failure()
        run: |
          docker compose \
            -f tests/e2e/docker-compose.yml \
            -p litellm-client-e2e \
            logs --no-color litellm-proxy || true

      - name: Always tear down the stack
        if: always()
        run: |
          docker compose \
            -f tests/e2e/docker-compose.yml \
            -p litellm-client-e2e \
            down -v --remove-orphans || true
