name: E2E (LiteLLM proxy + live providers)

# Runs the full LiteLLM-proxy round-trip against real LLM providers.
# Only fires on push to `main` (post-merge) and via manual dispatch — never
# on PR branches — so secrets are never exposed to forks and we don't burn
# provider budget on draft work.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: live-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    name: LiteLLM proxy + live providers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The `live` environment can be configured in repo settings to require
    # manual approval and to scope the provider secrets.
    environment: live

    env:
      OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPSEEK_API_KEY:  ${{ secrets.DEEPSEEK_API_KEY }}
      GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
      ALIBABA_API_KEY:   ${{ secrets.ALIBABA_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify at least one provider key is present
        run: |
          if [ -z "$OPENAI_API_KEY$ANTHROPIC_API_KEY$DEEPSEEK_API_KEY$GEMINI_API_KEY$ALIBABA_API_KEY" ]; then
            echo "::error::No provider API keys configured. Add them as repo secrets." >&2
            exit 1
          fi
          echo "Providers configured:"
          [ -n "$OPENAI_API_KEY"    ] && echo "  - OpenAI"
          [ -n "$ANTHROPIC_API_KEY" ] && echo "  - Anthropic"
          [ -n "$DEEPSEEK_API_KEY"  ] && echo "  - DeepSeek"
          [ -n "$GEMINI_API_KEY"    ] && echo "  - Gemini"
          [ -n "$ALIBABA_API_KEY"   ] && echo "  - Alibaba"

      - name: Pre-pull container images
        run: |
          docker pull postgres:16-alpine
          docker pull ghcr.io/berriai/litellm:main-stable

      - name: Run e2e suite
        run: npm run test:e2e

      - name: Dump LiteLLM proxy logs on failure
        if: failure()
        run: |
          docker compose \
            -f tests/e2e/docker-compose.yml \
            -p litellm-proxy-e2e \
            logs --no-color litellm-proxy || true

      - name: Always tear down the stack
        if: always()
        run: |
          docker compose \
            -f tests/e2e/docker-compose.yml \
            -p litellm-proxy-e2e \
            down -v --remove-orphans || true
